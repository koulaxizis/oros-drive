name: Release

# A tag like v0.3.0 builds the Windows setup and zips, the Linux
# tarballs and .deb packages and publishes them as a GitHub release.
# "Run workflow" with a version does the same from main and creates the
# tag (for when the tag cannot be pushed, e.g. from the GitHub app or a
# bot). A pull request that touches the packaging builds everything and
# tests the setup on Windows, without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.1.0 (the tag v0.1.0 is created)"
        required: true
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) v="${INPUT#v}" ;;
            pull_request) v=0.0.0 ;;
            *) v="${GITHUB_REF_NAME#v}" ;;
          esac
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: packaging/package.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: files
          path: out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-files
          path: out-setup/

  windows-setup:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: setup-files
          path: setup
      - name: Build orOS-Drive-Setup.exe
        shell: pwsh
        run: |
          # Greek.isl is written for Inno Setup 6.5+, newer than some runner images.
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE) { exit 1 }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ver = (Get-Content setup/VERSION).Trim()
          & $iscc /Qp "/DAppVer=$ver" setup/oros-drive.iss
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem setup/orOS-Drive-Setup-*.exe | Format-Table Name, Length
      - name: Install test (install, upgrade over the running app, uninstall)
        shell: pwsh
        run: packaging/windows/test-setup.ps1 (Get-ChildItem setup/orOS-Drive-Setup-*.exe).FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup
          path: setup/orOS-Drive-Setup-*.exe

  publish:
    needs: [package, windows-setup]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement that these files came from
      # this workflow at this commit. Anyone can check a download with
      # gh attestation verify <file> --repo koulaxizis/oros-drive
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: files
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: setup
          path: out
      - name: Checksums
        run: |
          cd out
          rm -f SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: out/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cd out
          gh release create "v$VERSION" ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "orOS Drive v$VERSION" --generate-notes

  channels:
    # Free install channels that point at the release: the Scoop bucket in
    # this repo (scoop bucket add oros-drive https://github.com/koulaxizis/oros-drive)
    # and winget (a pull request to microsoft/winget-pkgs, needs the
    # WINGET_TOKEN secret: a classic token with public_repo scope).
    needs: [package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
      - name: Manifests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          gh release download "v$VERSION" --pattern SHA256SUMS.txt --dir /tmp/sums
          packaging/channel-manifests.sh "$VERSION" /tmp/sums/SHA256SUMS.txt out/channels
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winget-manifests
          path: out/channels/winget
          retention-days: 7
      - name: Update the Scoop bucket on main
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          mkdir -p bucket && cp out/channels/bucket/oros-drive.json bucket/oros-drive.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/oros-drive.json
          git diff --cached --quiet && exit 0
          git commit -m "Scoop: orOS Drive $VERSION [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1

  winget:
    needs: channels
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: winget-manifests
          path: winget
      - name: Submit to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host "No WINGET_TOKEN secret: skipping winget."; exit 0 }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: koulaxizis.orOSDrive" winget
          if ($LASTEXITCODE) { exit 1 }
