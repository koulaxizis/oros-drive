name: Release

# A tag like v0.3.0 builds the Windows zips, Linux tarballs and .deb
# packages and publishes them as a GitHub release. "Run workflow" with
# a version does the same from main and creates the tag (for when the
# tag cannot be pushed, e.g. from the GitHub app or a bot).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 0.1.0 (the tag v0.1.0 is created)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            v="${INPUT#v}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::bad version '$v'"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: packaging/package.sh "$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --title "orOS Drive v$VERSION" --generate-notes
