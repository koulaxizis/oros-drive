name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      # The orOS disk in Explorer against the real Cloud Files driver
      # (wave 6); verbose, so a skip shows why.
      - name: Cloud Files test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          fltmc filters
          go test -count=1 -v -run TestExplorerFolder ./vdisk/cloudfiles/ ./app/
      - name: Smoke test of the real app
        shell: bash
        run: |
          go build -o smoke-bin/orosdrive${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/orosdrive
          packaging/smoke.sh smoke-bin/orosdrive${{ runner.os == 'Windows' && '.exe' || '' }}

  # The Go code against the real browser code: sync.js + vault.js from
  # koulaxizis/oros main, run in Node. Fails on any format drift.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: koulaxizis/oros
          ref: main
          path: oros-src
          sparse-checkout: |
            sync.js
            vault.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test -count=1 -v ./interop/
        env:
          OROS_SRC: ${{ github.workspace }}/oros-src
      # The WebDAV client against a real server (WsgiDAV): refused as
      # shipped (ETags per second), every promise kept with exact ETags.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install wsgidav==4.3.5 cheroot
      - run: |
          python interop/davserver.py "$RUNNER_TEMP/dav-stock" 8090 stock &
          python interop/davserver.py "$RUNNER_TEMP/dav-ns" 8091 ns &
          sleep 3
          OROS_DAV_TEST_URL=http://127.0.0.1:8090 OROS_DAV_TEST_WANT=dav-conditions go test -count=1 -v -run RealServer ./webdav/
          OROS_DAV_TEST_URL=http://127.0.0.1:8091 go test -count=1 -v -run RealServer ./webdav/
        env:
          OROS_DAV_TEST_USER: chris
          OROS_DAV_TEST_PASS: pw

  build:
    needs: [test, interop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release files
        run: packaging/package.sh "0.3.0-$(git rev-parse --short HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: orosdrive
          path: out/

  # orOS Drive for Android (android/): the Go core bound with gomobile
  # into app/libs/orosdrive.aar, then the app built with Gradle. The
  # orOS Android app embeds the same library (koulaxizis/oros
  # android.yml, pinned commit); signed release APKs are built there
  # with the orOS key and go to the orOS F-Droid repo.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: gomobile bind
        run: |
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          mkdir -p out android/app/libs
          gomobile bind -target=android/arm64,android/arm,android/amd64 -androidapi 24 -javapkg online.useoros.drive -o android/app/libs/orosdrive.aar ./mobile
          unzip -l android/app/libs/orosdrive.aar | grep -E 'classes.jar|libgojni.so'
          cp android/app/libs/orosdrive.aar out/
      - name: Build the app (debug + unsigned release)
        run: gradle -p android --no-daemon assembleDebug assembleRelease
        env:
          DRIVE_VERSION: 0.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: orosdrive-aar
          path: out/orosdrive.aar
      - uses: actions/upload-artifact@v4
        with:
          name: orosdrive-android
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
